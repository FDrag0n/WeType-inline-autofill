name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    env:
      # 签名凭据来自仓库 Secrets。缺失时自动退化为未签名构建，不影响 PR 校验。
      # 密钥与密码只允许通过 Secrets/keystore.properties 注入，不得提交进仓库。
      SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      ALIAS: ${{ secrets.ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # versionCode 取 git 提交数，必须拉取完整历史
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # GitHub 托管的 runner 已预装 Android SDK（ANDROID_SDK_ROOT 指向 /usr/local/lib/android/sdk），
      # 因此不使用 android-actions/setup-android：它会安装已被 Google 移除的旧版 `tools` 包，
      # 报 "Failed to find package 'tools'" 后 exit code 1，导致 job 直接失败。
      # 这里只做防御性补齐：接受许可并确保 compileSdk 需要的平台与构建工具存在，
      # 缺失或不支持时留空给 Gradle 自行 provision，不让该步骤成为硬失败点。
      - name: Prepare Android SDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          if [ -z "$sdkmanager" ]; then
            echo "sdkmanager not found; letting Gradle provision the SDK"
            exit 0
          fi
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" || true

      - name: Decode signing keystore
        if: env.SIGNING_KEY_B64 != ''
        run: |
          echo "$SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_KEY=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build
        # SIGNING_KEY / KEYSTORE_PASSWORD / ALIAS / KEY_PASSWORD 齐全时自动签名 release
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*.apk
          generate_release_notes: true
